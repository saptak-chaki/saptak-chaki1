<svg viewBox="0 0 720 1488" width="720" height="1488" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* AE86 & Red Car Vibration */
    @keyframes vib {
      0% { transform: translate(0,0); }
      25% { transform: translate(1px, -1px); }
      50% { transform: translate(-1px, 1px); }
      75% { transform: translate(1px, 1px); }
      100% { transform: translate(0,0); }
    }
    .car-vibe { animation: vib 0.1s infinite; transform-origin: center; }

    /* Headlight Blink/Flicker */
    @keyframes flicker {
      0%, 90%, 100% { opacity: 1; filter: drop-shadow(0 0 15px #00F5FF); }
      92%, 96% { opacity: 0.3; filter: none; }
    }
    .headlight { animation: flicker 3s infinite; }

    /* Exhaust Backfire (Crackle) */
    @keyframes crackle {
      0%, 80% { opacity: 0; transform: scale(0.5); }
      82% { opacity: 1; transform: scale(1.2); }
      85% { opacity: 0; transform: scale(1.5); }
    }
    .exhaust-fire { animation: crackle 1.5s infinite; fill: #FF4500; filter: blur(2px); }

    /* Dashboard Dial Animation */
    @keyframes dial-move {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(45deg); }
    }
    .needle { animation: dial-move 2s ease-in-out infinite; transform-origin: center; }

    /* LCD Blink */
    @keyframes lcd-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .lcd { animation: lcd-blink 1s infinite; }
  </style>

  <!-- Background -->
  <rect width="720" height="1488" fill="#0A0A1A"/>

  <!-- Main Image Section (Sharp redraw simulation) -->
  <g class="car-vibe">
    <!-- AE86 Sharp redrawn parts -->
    <rect x="0" y="0" width="720" height="420" fill="#151525"/>
    <!-- Simulated Image content -->
    <image href="https://i.imgur.com/sddefault.jpg" x="0" y="0" width="720" height="420" opacity="0.9"/>
    
    <!-- Red Car Backfire/Crackle -->
    <circle class="exhaust-fire" cx="120" cy="220" r="10"/>
    <circle class="exhaust-fire" cx="120" cy="220" r="6" style="animation-delay: 0.1s"/>
    
    <!-- AE86 Glowing Headlights -->
    <rect class="headlight" x="115" y="195" width="65" height="45" rx="5" fill="#00F5FF" opacity="0.8"/>
    <rect class="headlight" x="385" y="195" width="65" height="45" rx="5" fill="#00F5FF" opacity="0.8"/>
  </g>

  <!-- Dashboard Frame (Upgrade) -->
  <g transform="translate(20, 450)">
    <!-- System Status Panel -->
    <rect width="680" height="100" rx="15" fill="#1A1A3A" stroke="#00F5FF" stroke-width="2"/>
    <text x="30" y="45" fill="#00F5FF" font-family="monospace" font-size="20">SYSTEM STATUS: ONLINE</text>
    <text x="30" y="75" fill="#FF2BD6" font-family="monospace" font-size="16">DRIVER: SAPTAK CHAKI | ROLE: DEV</text>
    <circle class="lcd" cx="640" cy="40" r="8" fill="#00FF00"/>
  </g>

  <!-- Gauges Section -->
  <g transform="translate(20, 580)">
    <rect width="680" height="150" rx="15" fill="#1A1A3A" stroke="#FF2BD6" stroke-width="1.5"/>
    <!-- Dial 1 -->
    <circle cx="100" cy="75" r="50" fill="none" stroke="#C9D4E5" stroke-width="3"/>
    <line class="needle" x1="100" y1="75" x2="100" y2="35" stroke="#FF0000" stroke-width="4"/>
    <!-- Dial 2 -->
    <circle cx="270" cy="75" r="50" fill="none" stroke="#00F5FF" stroke-width="3"/>
    <line class="needle" x1="270" y1="75" x2="270" y2="35" stroke="#FF0000" stroke-width="4" style="animation-delay: 0.5s"/>
    <!-- Dial 3 -->
    <circle cx="440" cy="75" r="50" fill="none" stroke="#FFFF00" stroke-width="3"/>
    <line class="needle" x1="440" y1="75" x2="440" y2="35" stroke="#FF0000" stroke-width="4" style="animation-delay: 1s"/>
    <!-- Dial 4 -->
    <circle cx="610" cy="75" r="50" fill="none" stroke="#00FF00" stroke-width="3"/>
    <line class="needle" x1="610" y1="75" x2="610" y2="35" stroke="#FF0000" stroke-width="4" style="animation-delay: 1.5s"/>
  </g>

  <!-- Skill Diagnostic (Wheel Area) -->
  <g transform="translate(20, 750)">
    <rect width="680" height="250" rx="15" fill="#1A1A3A" stroke="#00F5FF" stroke-width="1.5"/>
    <circle cx="150" cy="125" r="80" fill="none" stroke="#FF2BD6" stroke-width="8" stroke-dasharray="400, 100"/>
    <circle cx="150" cy="125" r="60" fill="#05070D"/>
    
    <!-- Skill Bars -->
    <rect x="300" y="60" width="300" height="12" rx="6" fill="#05070D"/>
    <rect x="300" y="60" width="250" height="12" rx="6" fill="#00F5FF">
       <animate attributeName="width" from="0" to="250" dur="2s" fill="freeze" />
    </rect>
    <text x="300" y="50" fill="#C9D4E5" font-family="monospace" font-size="14">PYTHON ENGINE</text>

    <rect x="300" y="110" width="300" height="12" rx="6" fill="#05070D"/>
    <rect x="300" y="110" width="200" height="12" rx="6" fill="#FF2BD6">
       <animate attributeName="width" from="0" to="200" dur="2s" fill="freeze" />
    </rect>
    <text x="300" y="100" fill="#C9D4E5" font-family="monospace" font-size="14">JAVASCRIPT TURBO</text>

    <rect x="300" y="160" width="300" height="12" rx="6" fill="#05070D"/>
    <rect x="300" y="160" width="180" height="12" rx="6" fill="#FFFF00">
       <animate attributeName="width" from="0" to="180" dur="2s" fill="freeze" />
    </rect>
    <text x="300" y="150" fill="#C9D4E5" font-family="monospace" font-size="14">SECURITY BRAKES</text>
  </g>

  <!-- Tech Stack Grid -->
  <g transform="translate(20, 1020)">
    <rect width="680" height="150" rx="15" fill="#1A1A3A" stroke="#FF8C00" stroke-width="1.5"/>
    <rect x="40" y="30" width="130" height="40" rx="8" fill="#05070D" stroke="#00F5FF" class="lcd"/>
    <rect x="190" y="30" width="130" height="40" rx="8" fill="#05070D" stroke="#00F5FF" class="lcd" style="animation-delay: 0.2s"/>
    <rect x="340" y="30" width="130" height="40" rx="8" fill="#05070D" stroke="#00F5FF" class="lcd" style="animation-delay: 0.4s"/>
    <rect x="490" y="30" width="130" height="40" rx="8" fill="#05070D" stroke="#00F5FF" class="lcd" style="animation-delay: 0.6s"/>
  </g>

  <!-- Connect Bar -->
  <rect x="20" y="1200" width="680" height="60" rx="10" fill="#1A1A3A"/>
  <text x="360" y="1235" text-anchor="middle" fill="#00F5FF" font-family="monospace" font-size="14">SAPTAK.exe // MIDNIGHT PROTOCOL // END OF TRANSMISSION</text>
</svg>
